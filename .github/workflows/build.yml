# Builds the patched iloader (with the full 2FA method picker) for Windows only.
# The installer is uploaded as an artifact and also saved to the "windows-build" branch.
name: Build iloader (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      - name: Run the 2FA tests
        working-directory: src-tauri
        run: cargo test --release two_factor_response

      - name: Build
        run: bunx tauri build --bundles msi --config src-tauri/ci.conf.json

      - name: Collect installer
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/msi/*.msi out/iloader-fixed-windows-x64.msi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: iloader-fixed-windows
          path: out/iloader-fixed-windows-x64.msi

      - name: Save installer to the windows-build branch
        shell: bash
        run: |
          cd out
          git init -q -b windows-build
          git add iloader-fixed-windows-x64.msi
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "iloader-fixed from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" windows-build
